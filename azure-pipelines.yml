trigger:
 branches:
   include:
     - mian
     - feature/*

pool: rana-pool

stages:
  - stage: terraform init
    jobs:
      - job: init
        displayName: init
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'ranaservice'
              backendAzureRmStorageAccountName: 'storagepipeline11'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'

  - stage: terraform plan
    jobs:
      - job: plan
        displayName: plan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'ranaservice'
              backendAzureRmStorageAccountName: 'storagepipeline11'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'ranaservice'

  - stage: manual approval
    pool: server
    jobs:
      - job: approval 
        displayName: approval
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'rishi1234'

  - stage: terraform apply
    jobs:
      - job: apply
        displayName: apply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'ranaservice'
              backendAzureRmStorageAccountName: 'storagepipeline11'
              backendAzureRmContainerName: 'mycontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'ranaservice'